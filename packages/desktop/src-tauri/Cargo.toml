[package]
name = "corkboards-desktop"
version = "0.7.67"
description = "Corkboards desktop app"
edition = "2021"

[lib]
name = "corkboards_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
tokio = { version = "1", features = ["time", "sync", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tokio-socks = "0.5"
tokio-native-tls = "0.3"
native-tls = "0.2"
url = "2"
dirs = "5"
futures-util = "0.3"
# Used by signer.rs to sign events and do NIP-04/44 encryption inside Rust so
# the nsec (read from the OS keychain) never crosses the IPC boundary into JS.
nostr = { version = "0.44.3", default-features = false, features = ["std", "nip04", "nip44"] }
